name: Bug report
description: The game or a tool misbehaves after a successful install
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do NOT attach game files, disc images, BIOS or memory cards/saves. Replace your home folder in any path with `<home>`. See REPORTING.md.
  - type: input
    id: where
    attributes:
      label: Where in the game (disc, scene, what you did)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Tail of play\last.log and play\last.err (scrubbed)
      render: text
  - type: input
    id: system
    attributes:
      label: Windows version, GPU and driver
    validations:
      required: true
  - type: dropdown
    id: bios
    attributes:
      label: BIOS used
      options: [OpenBIOS (default), My own SCPH-5501]
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I attached no game files, BIOS or saves, and replaced my home folder with <home>.
          required: true
