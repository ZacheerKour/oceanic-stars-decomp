# psxrecomp game.toml scaffold for Star Ocean - The Second Story (USA), 2 discs.
# Schema: tools/ref/psxrecomp/docs/config_schema.md (psxrecomp f42d2c0). NOTHING HERE HAS BEEN RUN through psxrecomp's generate/runtime yet.
# Values with no TODO are settled by evidence (comment next to each; details RECOMP_NOTES.md '2026-10-26 game.toml values').
# TODO(verify) marks what still needs a psxrecomp build or a runtime run. Paths are relative to the *title project root*
# (a separate, private repo that pins psxrecomp as a submodule), not to this repo; see recomp/README.md.

[game]
name = "Star Ocean - The Second Story (USA)"
id = "SCUS-94421"                       # disc 1 SYSTEM.CNF: BOOT = cdrom:\SCUS_944.21;1
exe = "disc/SCUS_944.21"                # = [prepare_disc] out_dir + boot_exe: prepare_disc.py writes the boot exe to <out_dir>/<boot_exe> (probe_disc.py renders exe the same way)
# Local dump names (single-track MODE2/2352 cues). The C++ loader prefers `discs`; Python tools (prepare_disc.py,
# aot_overlay_pipeline.py game_disc) read only `disc`, so `disc` names disc 1 (the only disc with SO2.BIN in its ISO directory).
disc = "disc/Star Ocean - The Second Story (USA) (Disc 1).cue"
discs = ["disc/Star Ocean - The Second Story (USA) (Disc 1).cue", "disc/Star Ocean - The Second Story (USA) (Disc 2).cue"]
disc_serials = ["SCUS-94421", "SCUS-94422"]                  # SYSTEM.CNF BOOT: SCUS_944.21 (disc 1), SCUS_944.22 (disc 2); both exes have the same sha256
load_address = "0x80010000"             # PS-X header +0x18
entry_pc = "0x80010008"                 # PS-X header +0x10 (the game's main() is at 0x80010650)
text_size = "0x1F800"                   # PS-X header +0x1C (129024 B); file is 131072 B incl. the 0x800 header; 4 KiB aligned
stack_base = "0x801FFFF0"               # PS-X header initial sp (+0x30; header gp is 0). SYSTEM.CNF STACK = 801fff00 is the BIOS kernel stack, not the exe sp; equals psxrecomp default

[recompiler]
seeds = "seeds/seeds.txt"               # copy of config/seeds.txt (boot exe). Format checked: main_psx.cpp reads one strtoul(.., 16) address per line, '#' lines skipped
out_dir = "generated"
strict = true                           # config_loader.cpp default is true; schema: "currently always true"
discovery = "whole-image"               # "reachable" follows jal only and leaves jalr targets to the interpreter: --exact found 140 of 570 boot functions (RECOMP_NOTES 'First analyze run')
bios_config = "psxrecomp/bios/SCPH5501.toml"  # retail SCPH-5501 (user's own dump, never committed) is the runtime BIOS; its address model
                                        # folds RAM aliases for game codegen. Apply recomp/bios/SCPH5501_install_slots.patch to the
                                        # submodule first (one SO2 kernel patch range); RECOMP_NOTES '2026-10-27 BIOS usage'

[prepare_disc]                          # parallel lists, disc 1 then disc 2: our local single-track .bin dumps (not compared with Redump: no offline DB)
out_dir = "disc"                        # prepare_disc.py default would be "prepared_disc"; "disc" makes [game] exe resolve
boot_exe = "SCUS_944.21"                # disc 2 boots SCUS_944.22 (same bytes): run prepare_disc.py --boot-exe SCUS_944.22 --bin-name/--cue-name "<Disc 2 names>" for it
bin_name = "Star Ocean - The Second Story (USA) (Disc 1).bin"   # without it prepare_disc.py takes Path([game] disc).name, i.e. the .cue name
cue_name = "Star Ocean - The Second Story (USA) (Disc 1).cue"
known_sizes = [556320912, 723338784]
known_md5   = ["c560c795e534261f4a0df5c98099f905", "d501280365480367395073aeee4dc52c"]
known_sha1  = ["ccd092233b353d2aa7bb80ecdb2b76f456430b41", "68178c55a430eab3e97eb51ec4a164d36f228aa1"]

[runtime]
overlay_cache = true                    # psxrecomp scaffold default (probe_disc.py) and required by the packager (GAME_PROJECT_SETUP.md); records the SLZ overlays it interprets
disc_speed = "1x"                       # = runtime default ("default: authentic 1x timing", runtime/src/main.cpp f42d2c0); faster ("2x"/"4x"/"instant") is a later tuning step that needs a boot test
openbios = false                        # retail required: OpenBIOS stores the device-table END (0x6238) at 0x154 where the game
                                        # (A 0x8004B2B0, C 0x80071530) reads a byte size, and SO2's 8 Psy-Q kernel patchers are laid out
                                        # for the retail kernel (B0[0x5B]+0x594/0x62C/0x884/0x894/0x9C8). RECOMP_NOTES '2026-10-27 BIOS usage'
bios_hle = false                        # pure LLE. Must be explicit: the game.toml loader defaults it to TRUE (config_loader.h f42d2c0), which skips the
                                        # shell and HLEs B0 events. Both modes reached the title on SCPH-5501; LLE is the reference. RECOMP_NOTES '2026-10-27 SCPH5501 backend'
# Audio/video: no XA and no CD-DA to configure. Sector census 2026-10-26: no sector on either disc has the XA audio (0x04) or
# video (0x02) submode bit (disc 1: 236155 data, 216 Form 2, 160 other), and both cues are single-track (no CD-DA).
# STR movies are plain data entries inside SO2.BIN (ANALYSIS.md), decoded by the game through MDEC.
# TODO(verify): [video]/[widescreen] left at upstream defaults (a look decision, needs a run).
