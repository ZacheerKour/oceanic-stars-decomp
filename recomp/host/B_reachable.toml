# Generator config for main program B as a standalone image, used only to compare discovery modes
# on the host (RECOMP_NOTES.md '2026-10-26 Host compile, A data region, overlay decoder'). Not the AOT path:
# the real pipeline compiles overlays with --overlay (exact entries). B.exe = stage_overlays.py wrapper.
[game]
name = "SO2 program B"
exe = "B.exe"

[recompiler]
seeds = "B.seeds.txt"
out_dir = "generated"
discovery = "reachable"   # exact-entry walk from the seeds (no whole-image data-as-code sweep)
