; PLAY.bat settings. Copied to settings.ini on the first start; edit settings.ini, not this file.
[play]
; auto = roms\scph5501.bin (your own SCPH-5501 dump) if present, else the OpenBIOS bundled with psxrecomp.
; Or: openbios, or a path to a BIOS image the build has a backend for.
bios = auto
; extra command-line arguments for psxrecomp-game.exe (space separated)
extra_args =
; environment variables for the runtime, as env.NAME = value, e.g.
; env.PSX_FPS_TELEMETRY = 1

; Audio buffer in milliseconds (30..500). Larger rides out longer hitches (disc loads, audio device switches) but sound
; lags the picture by that much. Bigger device buffers too: env.SDL_AUDIO_DEVICE_SAMPLE_FRAMES = 1024 (SDL hint; default
; is the device's own period, about 10 ms on Windows).
audio.buffer_ms = 180
; Display. The picture keeps the PS1's 4:3 shape inside any window size, with equal black bars on both sides (or top and
; bottom); resizing, maximising and fullscreen (Alt+Enter or Ctrl+F) re-fit it.
; A missing, misspelled or out-of-range display value is ignored: the default is used and a note goes to the console and
; play\settings.warn. Words are not case sensitive.
; window_width: starting window width in pixels (640..7680); the height follows 4:3 (960 -> 960x720). Default 960.
window_width = 960
; render_scale: internal 3D resolution, whole numbers 1 = native PS1 (320x240) .. 8 (2560x1920). Default 1. Higher is sharper and needs a faster GPU.
render_scale = 1
; scale_mode (default fit): fit = largest 4:3 picture; integer = whole multiples of 240 lines (crisp, wider bars); stretch = fill the window.
scale_mode = fit
; filter (default linear): linear (smooth) or nearest (hard pixels) when the picture is scaled to the window.
filter = linear

; Gamepad: left-stick dead zone for stick -> d-pad (0..32767; 9000 is about 27 percent). Pads work with no setup (first pad found,
; hot-plug ok). Odd pads: put an SDL gamecontrollerdb.txt next to PLAY.bat.
pad.deadzone = 9000

; Keyboard, rebindable: key.<PS1 button> = <key>[, <second key>] using SDL key names (A-Z, 0-9, F1-F12, Space, Tab, Return,
; Escape, Backspace, Left Shift, Right Shift, Left Ctrl, Up, Down, Left, Right, ...); None unbinds. Applied on every start.
; Defaults: WASD + arrows = d-pad, Space/Q/E/R (or 1/2/3/4) = Cross/Circle/Square/Triangle, Shift or Z = L1, F or X = R1,
; Tab or C = L2, G or V = R2, Esc or Enter = Start, Backspace or Right Shift = Select, T/Y = L3/R3.
key.up = W, Up
key.down = S, Down
key.left = A, Left
key.right = D, Right
key.cross = Space, 1
key.circle = Q, 2
key.square = E, 3
key.triangle = R, 4
key.l1 = Left Shift, Z
key.r1 = F, X
key.l2 = Tab, C
key.r2 = G, V
key.l3 = T
key.r3 = Y
key.start = Escape, Return
key.select = Backspace, Right Shift
