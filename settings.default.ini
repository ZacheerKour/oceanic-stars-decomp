; PLAY.bat settings. Copied to settings.ini on the first start; edit settings.ini, not this file.
[play]
; auto = roms\scph5501.bin (your own SCPH-5501 dump) if present, else the OpenBIOS bundled with psxrecomp.
; Or: openbios, or a path to a BIOS image the build has a backend for.
bios = auto
; extra command-line arguments for psxrecomp-game.exe (space separated)
extra_args =
; environment variables for the runtime, as env.NAME = value, e.g.
; env.PSX_FPS_TELEMETRY = 1
